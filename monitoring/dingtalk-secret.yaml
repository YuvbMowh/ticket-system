# 钉钉机器人 Token（演示占位）
# 配置方法：钉钉群 → 群设置 → 智能群助手 → 添加机器人（自定义）→ 复制 access_token 替换下方占位
# 安全：Secret 经 base64 存储于集群；生产建议用 ExternalSecret 托管
apiVersion: v1
kind: Secret
metadata:
  name: dingtalk-secret
  namespace: monitoring
type: Opaque
stringData:
  # prometheus-webhook-dingtalk 的配置文件（挂载到容器 /etc/prometheus-webhook-dingtalk/config.yaml）
  config.yaml: |
    targets:
      webhook1:
        url: https://oapi.dingtalk.com/robot/send?access_token=在这里粘贴你的钉钉机器人Token
