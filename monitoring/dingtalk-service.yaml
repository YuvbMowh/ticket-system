# 钉钉桥接服务 ClusterIP Service：Alertmanager 通过 http://prometheus-webhook-dingtalk:8060 访问
apiVersion: v1
kind: Service
metadata:
  name: prometheus-webhook-dingtalk
  namespace: monitoring
spec:
  selector:
    app: prometheus-webhook-dingtalk
  ports:
    - name: http
      port: 8060
      targetPort: 8060
  type: ClusterIP
