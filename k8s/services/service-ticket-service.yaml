# ticket-service Service（ClusterIP）
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: ticket-system
  labels:
    app: ticket-service      # 供 Prometheus 服务发现(ServiceMonitor selector/relabel)使用
spec:
  selector:
    app: ticket-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP
