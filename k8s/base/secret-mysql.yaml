# Secret：MySQL 凭据
# 为什么用 stringData：明文书写便于演示阅读，kubectl apply 后 K8s 自动做 base64 编码存储
# 生产安全：本文件不入 git；演进用 SealedSecret / ExternalSecret / Vault 托管
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: ticket-system
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "Root@123456"   # StatefulSet 初始化 root 密码
  DB_USER: "root"                      # 应用连接账号（演示用 root；生产最小权限原则）
  DB_PASSWORD: "Root@123456"
